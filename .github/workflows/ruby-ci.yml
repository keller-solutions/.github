name: Ruby CI

on:
  workflow_call:
    inputs:
      brakeman:
        description: "Run Brakeman security scan"
        required: false
        type: boolean
        default: true
      bundler-audit:
        description: "Run bundler-audit gem scan (delegates to bundle-audit.yml)"
        required: false
        type: boolean
        default: true
      bundler-audit-honor-ignore-list:
        description: "Apply the ignore list in bundler-audit-config-file. Off by default: any open advisory fails the build."
        required: false
        type: boolean
        default: false
      bundler-audit-config-file:
        description: "bundler-audit config holding the ignore list. Rails 8 apps use config/bundler-audit.yml."
        required: false
        type: string
        default: ".bundler-audit.yml"
      rubocop:
        description: "Run RuboCop linting"
        required: false
        type: boolean
        default: true
      importmap-audit:
        description: "Run importmap audit for JS dependencies"
        required: false
        type: boolean
        default: false

jobs:
  # One source of truth for gem advisories. The `./` reference resolves to this
  # repository at the same commit as ruby-ci.yml, so a caller pinned to a tag
  # gets bundle-audit.yml from that same tag.
  bundler_audit:
    if: inputs.bundler-audit
    uses: ./.github/workflows/bundle-audit.yml
    permissions:
      contents: read
    with:
      honor-ignore-list: ${{ inputs.bundler-audit-honor-ignore-list }}
      config-file: ${{ inputs.bundler-audit-config-file }}

  scan_ruby:
    name: Security Scan (Ruby)
    runs-on: ubuntu-latest
    if: inputs.brakeman

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: |
          rc=0
          bin/brakeman --no-pager || rc=$?
          if [ $rc -eq 5 ]; then
            echo "::warning::Brakeman is not the latest version. Consider updating."
            exit 0
          fi
          exit $rc

  scan_js:
    name: Security Scan (JS)
    runs-on: ubuntu-latest
    if: inputs.importmap-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: inputs.rubocop
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github
